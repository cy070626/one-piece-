<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招式动作检视</title><style>body{margin:0;background:#081827;color:#e8eef4;font:15px system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:24px}p{color:#a9bdd0}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}button,select,input{background:#183248;color:#edf4fb;border:1px solid #506778;border-radius:6px;padding:10px}canvas{width:100%;aspect-ratio:16/9;border-radius:12px}output{font-variant-numeric:tabular-nums}a{color:#97d6eb}.meter{min-height:28px}#skill-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 16px}#skill-facts div{padding:10px;background:#142b3c;border:1px solid #314457;border-radius:6px}#skill-facts b{display:block;font-size:17px;color:#f1ce86}#skill-facts small{font-size:11px;color:#a9bdd0}#skill-facts p{grid-column:1/-1;font-size:12px;line-height:1.7;margin:0}body.embedded main{padding:12px}body.embedded main>a,body.embedded h1,body.embedded main>p{display:none}body.embedded nav{margin:0 0 12px}nav>*{min-height:44px}canvas{display:block}@media(max-width:650px){main{padding:12px}nav{gap:7px}button,select{padding:8px;font-size:12px}#skill-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.meter{font-size:12px;line-height:1.7}}

</style><main><button id="preview-back">← 返回上一页 · Esc</button><h1>招式动作检视</h1><p>与正式比赛共用角色动作、特效和伤害判定。此页提供满能量、静止靶与重放，便于逐招检查。</p><nav><select id="actor" aria-label="角色"></select><select id="skill" aria-label="技能"></select><select id="release" aria-label="释放方式"><option value="normal">普通释放</option><option value="armament">武装附着 · 角色须拥有</option><option value="conqueror">霸王附着 · 角色须拥有</option><option value="awakening">极限释放 · 仅必杀</option></select><select id="defense" aria-label="靶防守"><option value="none">静止靶</option><option value="block">持续防御</option></select><select id="distance" aria-label="起始距离"><option value="95">近距 · 95</option><option value="175">中距 · 175</option><option value="350">远距 · 350</option></select><button id="play">重放招式</button><button id="pause">暂停动作</button><button id="step">逐帧前进</button><button id="wind">蓄力阶段</button><button id="impact">首段命中帧</button><button id="finish">末段命中帧</button><button id="fatigue">虚弱阶段</button><label>速度 <select id="speed"><option value="1">正常</option><option value=".35">慢动作</option></select></label></nav><div class="meter"><output id="info"></output></div><canvas id="battle" width="1280" height="720"></canvas><section id="skill-facts" aria-live="polite"></section></main><script src="game/haki.js?v=1804"></script><script src="game/roster.js?v=1804"></script><script src="game/expansion.js?v=1804"></script><script src="game/engine.js?v=1804"></script><script src="game/sprite-data.js?v=1804"></script><script src="game/sprites.js?v=1804"></script><script src="game/motion.js?v=1804"></script><script src="game/ink.js?v=1804"></script><script src="game/skill-info.js?v=1804"></script><script src="game/abilities.js?v=1804"></script><script src="game/expansion-visual.js?v=1804"></script><script src="game/benchmark-visual.js?v=1804"></script><script src="game/render.js?v=1804"></script><script src="game/preview.js?v=1804"></script></html>
